services:

  mysql:
    image: mysql:8.0
    container_name: url-shortener-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    volumes:
      - url-shortener_mysql_data:/var/lib/mysql

    networks:
      - url-shortener-network

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u${MYSQL_USER}",
          "-p${MYSQL_PASSWORD}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s


  redis:
    image: redis:7-alpine
    container_name: url-shortener-redis
    restart: unless-stopped

    command: redis-server --appendonly yes

    volumes:
      - url-shortener_redis_data:/data

    networks:
      - url-shortener-network

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  app:
    image: url-shortener:v1.0
    container_name: url-shortener-app
    restart: unless-stopped

    environment:
      APP_PORT: ${APP_PORT}

      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

      REDIS_HOST: redis
      REDIS_PORT: 6379

    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - url-shortener-network

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/')"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s


  nginx:
    image: nginx:latest
    container_name: url-shortener-nginx
    restart: unless-stopped

    ports:
      - "8080:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      app:
        condition: service_healthy

    networks:
      - url-shortener-network


volumes:
  url-shortener_mysql_data:
    name: url-shortener_mysql_data

  url-shortener_redis_data:
    name: url-shortener_redis_data


networks:
  url-shortener-network:
    name: url-shortener-network
    driver: bridge


