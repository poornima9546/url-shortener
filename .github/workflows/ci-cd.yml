name: URL Shortener CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci-cd:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install flake8

      # 4. Lint
      - name: Lint
        run: |
          flake8 app tests

      # 5. Unit tests
      - name: Unit tests
        run: |
          pytest tests/

      # 6. Build Docker image
      - name: Build Docker image
        run: |
          docker build -t url-shortener:${{ github.sha }} .

      # 7. Scan Docker image
      - name: Scan Docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: url-shortener:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      # 8. Log in to Docker Hub
      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 9. Tag Docker image
      - name: Tag Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag url-shortener:${{ github.sha }} poornimab03/url-shortener:v1.0
          docker tag url-shortener:${{ github.sha }} poornimab03/url-shortener:latest

      # 10. Push Docker images
      - name: Push Docker images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push poornimab03/url-shortener:v1.0
          docker push poornimab03/url-shortener:latest
